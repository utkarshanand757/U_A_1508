<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question for Arvi</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe6ea 0%, #ffccd5 50%, #fbc4d2 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }
    /* Floating background elements */
    .bg-heart {
      position: absolute;
      color: rgba(255, 77, 109, 0.25);
      animation: floatUp 8s linear infinite;
      user-select: none;
      z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
      20% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(255, 75, 110, 0.18);
      text-align: center;
      max-width: 440px;
      width: 90%;
      position: relative;
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.85);
    }
    .cartoon-box {
      width: 220px;
      height: 160px;
      margin: 0 auto 12px auto;
      filter: drop-shadow(0 8px 12px rgba(216, 27, 96, 0.12));
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #d81b60;
      margin-bottom: 4px;
      line-height: 1.1;
    }
    .question {
      font-size: 1.35rem;
      font-weight: 600;
      color: #333;
      margin: 10px 0 4px 0;
    }
    .sender {
      font-size: 0.95rem;
      color: #777;
      font-style: italic;
      margin-bottom: 22px;
    }
    .btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }
    button {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-family: 'Poppins', sans-serif;
    }
    #yesBtn {
      background: linear-gradient(135deg, #ff4081, #d81b60);
      color: #fff;
      box-shadow: 0 8px 20px rgba(216, 27, 96, 0.35);
    }
    #yesBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(216, 27, 96, 0.5);
    }
    #noBtn {
      background: #f1f3f5;
      color: #6c757d;
      border: 1px solid #dee2e6;
      position: relative;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* Accepted Screen */
    .success-view {
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .success-view h2 {
      font-family: 'Caveat', cursive;
      font-size: 3.2rem;
      color: #d81b60;
      margin-bottom: 10px;
    }
    .success-view p {
      font-size: 1.15rem;
      color: #444;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="heartContainer"></div>

  <div class="card" id="proposalCard">
    <!-- Initial Question Screen -->
    <div id="askView">
      <div class="cartoon-box">
        <svg viewBox="0 0 260 190" width="100%" height="100%">
          <defs>
            <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff4081" flood-opacity="0.3"/>
            </filter>
          </defs>

          <!-- UTKARSH (Left Character) -->
          <!-- Navy Blazer & Shirt -->
          <path d="M 40 190 L 40 145 Q 75 125 110 145 L 110 190 Z" fill="#1b2a4a" />
          <polygon points="75,133 62,158 88,158" fill="#a0c4e2" />
          <!-- Neck -->
          <rect x="68" y="120" width="14" height="15" fill="#f2be9b" />
          <!-- Head -->
          <circle cx="75" cy="85" r="32" fill="#f5c7a5" />
          <!-- Hair & Beard (Accurate to photo) -->
          <path d="M 43 80 C 40 50, 95 40, 107 72 C 103 62, 85 55, 60 62 C 48 67, 45 78, 43 80 Z" fill="#1c140d" />
          <!-- Eyes & Eyebrows -->
          <path d="M 58 72 Q 65 68 70 73" stroke="#1c140d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="65" cy="80" r="3.2" fill="#1c140d" />
          <path d="M 80 73 Q 85 68 92 72" stroke="#1c140d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="85" cy="80" r="3.2" fill="#1c140d" />
          <!-- Moustache & Trimmed Stubble -->
          <path d="M 66 94 Q 75 99 84 94 Q 75 92 66 94 Z" fill="#1c140d" />
          <path d="M 55 93 Q 75 120 95 93 Q 75 112 55 93 Z" fill="#1c140d" opacity="0.35" />
          <!-- Smile -->
          <path d="M 70 100 Q 75 105 80 100" stroke="#a6593b" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- ARVI (Right Character) -->
          <!-- Long Hair (Back) -->
          <path d="M 145 75 C 135 70, 130 140, 135 180 C 145 185, 220 185, 225 175 C 230 135, 225 70, 215 75 Z" fill="#2d1c13" />
          <!-- Top with subtle pattern -->
          <path d="M 150 190 L 150 145 Q 185 125 220 145 L 220 190 Z" fill="#e8d8d8" />
          <path d="M 150 145 Q 185 125 220 145 L 220 190 L 150 190 Z" fill="none" stroke="#685558" stroke-width="1.5" stroke-dasharray="3,3" />
          <!-- Neck -->
          <rect x="178" y="120" width="14" height="15" fill="#f7cdb0" />
          <!-- Head -->
          <circle cx="185" cy="85" r="31" fill="#fad7be" />
          <!-- Hair (Front framing) -->
          <path d="M 154 75 C 158 52, 212 52, 216 75 C 205 60, 185 58, 165 65 Z" fill="#2d1c13" />
          <path d="M 154 75 C 150 100, 155 130, 160 145" stroke="#2d1c13" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M 216 75 C 220 100, 215 130, 210 145" stroke="#2d1c13" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Eyes & Brows -->
          <path d="M 170 73 Q 175 70 180 74" stroke="#2d1c13" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="176" cy="80" r="3.2" fill="#2d1c13" />
          <path d="M 190 74 Q 195 70 200 73" stroke="#2d1c13" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="194" cy="80" r="3.2" fill="#2d1c13" />
          <!-- Cute Blush -->
          <ellipse cx="169" cy="88" rx="5" ry="3" fill="#ff708a" opacity="0.45" />
          <ellipse cx="201" cy="88" rx="5" ry="3" fill="#ff708a" opacity="0.45" />
          <!-- Sweet Smile -->
          <path d="M 180 94 Q 185 101 190 94" stroke="#c45353" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- Proposal Diamond Ring held between them -->
          <g filter="url(#softGlow)">
            <circle cx="130" cy="138" r="11" fill="none" stroke="#ffd700" stroke-width="3.5" />
            <polygon points="130,120 138,129 122,129" fill="#00e5ff" />
            <line x1="130" y1="113" x2="130" y2="117" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
            <line x1="120" y1="120" x2="123" y2="123" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
            <line x1="140" y1="120" x2="137" y2="123" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <h1>Arvi Mishra!</h1>
      <p class="question">Will u marry me? 💝</p>
      <p class="sender">Forever yours, Utkarsh Anand</p>

      <div class="btn-wrap">
        <button id="yesBtn">Yes! 💍</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <!-- Success Screen on "Yes" -->
    <div id="successView" class="success-view">
      <div class="cartoon-box" style="height: 110px;">
        <svg viewBox="0 0 120 100" width="100%" height="100%">
          <path d="M60 85 C15 45, 20 10, 60 30 C100 10, 105 45, 60 85 Z" fill="#ff4081" />
          <circle cx="48" cy="38" r="3" fill="#fff" />
          <circle cx="72" cy="38" r="3" fill="#fff" />
          <path d="M55 48 Q60 54 65 48" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <h2>Yaaaay! 🥰</h2>
      <p>I promise to love you, cherish you, and make you smile every single day, Arvi.</p>
      <p style="margin-top: 15px; font-weight: 600; color: #d81b60;">— Utkarsh Anand ❤️</p>
    </div>
  </div>

  <script>
    // Create animated floating hearts
    const heartContainer = document.getElementById('heartContainer');
    const heartIcons = ['💖', '🌸', '✨', '💕', '💍'];
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (5 + Math.random() * 6) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.style.fontSize = (16 + Math.random() * 22) + 'px';
      heartContainer.appendChild(heart);
    }

    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const askView = document.getElementById('askView');
    const successView = document.getElementById('successView');

    // Runaway "No" button
    function dodgeButton() {
      const card = document.getElementById('proposalCard');
      const cardRect = card.getBoundingClientRect();
      
      const maxX = cardRect.width - noBtn.offsetWidth - 30;
      const maxY = cardRect.height - noBtn.offsetHeight - 30;

      const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
      const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

      noBtn.style.position = 'absolute';
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    noBtn.addEventListener('mouseenter', dodgeButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dodgeButton();
    });

    // Celebration fireworks and message on "Yes"
    yesBtn.addEventListener('click', () => {
      askView.style.display = 'none';
      successView.style.display = 'flex';

      confetti({
        particleCount: 130,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4081', '#ff8da1', '#ffd700', '#ffffff']
      });

      const interval = setInterval(() => {
        confetti({
          particleCount: 25,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff4081', '#d81b60', '#ff8da1']
        });
        confetti({
          particleCount: 25,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff4081', '#d81b60', '#ff8da1']
        });
      }, 400);

      setTimeout(() => clearInterval(interval), 3500);
    });
  </script>
</body>
  </html>
